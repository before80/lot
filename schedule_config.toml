# 定时任务调度器配置
# 时区设置（支持所有标准时区，如 Asia/Shanghai, America/New_York 等）
timezone = "Asia/Shanghai"

# 检查间隔（秒），建议设置为60（每分钟检查一次）
check_interval = 60

# 执行时间点配置
# 格式：星期几:时:分
# 星期几：0=周日，1=周一，2=周二，3=周三，4=周四，5=周五，6=周六
# 示例：
#   "1:23:58"  # 周一 23:58
#   "3:23:58"  # 周三 23:58
#   "6:23:58"  # 周六 23:58
time_points = [
    "1:23:58",
    "3:23:58",
    "6:23:58",
]

# 更多示例：
# time_points = [
#     "1:09:30",   # 周一 09:30
#     "1:14:00",   # 周一 14:00
#     "3:12:00",   # 周三 12:00
#     "6:08:00",   # 周六 08:00
#     "6:16:30",   # 周六 16:30
# ]
